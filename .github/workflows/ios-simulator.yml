name: Build Monthly Expenses iOS Simulator

# Manual only: avoid extra emails/builds after each small finance-app edit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-simulator:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Capacitor iOS application
        run: npm run ios:init
      - name: Build unsigned iOS simulator app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Pack simulator build
        run: |
          cd build/ios/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent App.app "$GITHUB_WORKSPACE/monthly-expenses-ios-simulator.zip"
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: monthly-expenses-ios-simulator
          path: monthly-expenses-ios-simulator.zip
          if-no-files-found: error
