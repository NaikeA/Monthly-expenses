<body><aside><div><h2>€ Monthly Expenses</h2><small>Personal finance tracker</small></div><nav id="nav"><button data-page="dashboard" class="active">Monthly Dashboard</button><button data-page="yearly">Yearly Dashboard</button><button data-page="income">Income</button><button data-page="budgets">Monthly expenses</button><button data-page="quarterly">Quarterly bills</button><button data-page="halfyearly">Half-yearly expenses</button><button data-page="annual">Annual bills</button><button data-page="accounts">Accounts</button><button data-page="settings">Settings & backup</button></nav><div class="foot">Private, local browser storage.<br>Export backups regularly.</div></aside>
<main><header><div><h1 id="title">Dashboard</h1><p>Based on your Monthly expenses spreadsheet</p></div><div class="topactions"><label>Month <input id="month" type="month"></label></div></header><div id="view"></div></main>
<dialog id="dialog"><form id="form"><div id="fields"></div><div class="dialogbuttons"><button type="button" id="cancel">Cancel</button><button type="submit" class="primary">Save</button></div></form></dialog><input type="file" id="import" accept=".json" hidden>
<script>
try {
(function(){
"use strict";
const KEY="monthly-expenses-naikea-v1",uid=()=>Math.random().toString(36).slice(2,11),money=n=>new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR"}).format(Number(n)||0),sum=(a,k="amount")=>a.reduce((s,x)=>s+(Number(x[k])||0),0),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),item=(name,amount)=>({id:uid(),name,amount});
const defaults={income:4437,incomes:{},fixed:[item("Rent",1000),item("Internet",40),item("Electricity",60),item("Gym",25),item("Radio",18.36),item("Bank",7),item("Monoxidil",20),item("Netflix",6)],variable:[item("Food + Groceries",200),item("Diesel",100),item("Eating Out",100),item("Pleasure",100),item("Aai Medicines",100),item("India Trip",0),item("Amazon Shopping",0),item("Cash",0),item("Amazon Credit Card Bill",0)],cardBills:[],incomeEntries:[],incomeCategories:["Salary","Unemployment benefit","Interest","Dividends","Refund","Other income"],quarterly:[],halfyearly:[],annual:[{...item("Liability",78.39),due:"2026-05-21"},{...item("Car HUK 24",912.62),due:"2026-09-01"},{...item("Car Municipality",238),due:"2026-09-01"},{...item("Car Inspection TÜV + Tire replacement",0),due:"2026-03-01"},{...item("Radio",212.32),due:"2026-12-15"}],accounts:["Active Account","Flexgeld Deutsche Bank","Deposit","Wise","Scalable","Scalable Saving"].map(name=>({id:uid(),name,balance:0})),transactions:[]};
let data;try{data=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch{data=structuredClone(defaults)}if(!data||typeof data!=="object"||Array.isArray(data))throw Error("Saved data is not a valid expense record");
Object.keys(defaults).forEach(k=>{if(data[k]===undefined)data[k]=structuredClone(defaults[k])});
for(const type of ["fixed","variable","quarterly","halfyearly","annual","accounts","transactions","cardBills"]){if(!Array.isArray(data[type]))data[type]=structuredClone(defaults[type])}
if(!data.incomes||typeof data.incomes!=="object")data.incomes={};if(!data.variable.some(x=>x.name==="Amazon Credit Card Bill"))data.variable.push(item("Amazon Credit Card Bill",0));const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const month=document.getElementById("month");month.value=new Date().toLocaleDateString("en-CA").slice(0,7);if(!/^\d{4}-\d{2}$/.test(month.value))month.value=new Date().toISOString().slice(0,7);const baseCategories=["Rent","Internet","Electricity","Car","Gym","Monoxidil","Insurance","Food","Leisure","Travel","Education","Healthcare","Shopping","Banking","Subscriptions","Other expenses"];
const inferCategory=n=>{n=String(n||"").toLowerCase();for(const [rx,c] of [[/rent/,"Rent"],[/internet/,"Internet"],[/electricity/,"Electricity"],[/diesel|car|tüv|tire|municipality/,"Car"],[/gym/,"Gym"],[/monoxidil|minoxidil/,"Monoxidil"],[/insurance|liability|huk/,"Insurance"],[/grocer|food|eating out|restaurant/,"Food"],[/pleasure/,"Leisure"],[/trip/,"Travel"],[/education|course/,"Education"],[/medicine/,"Healthcare"],[/amazon|shopping/,"Shopping"],[/bank/,"Banking"],[/netflix|radio/,"Subscriptions"]])if(rx.test(n))return c;return "Other expenses"};
if(!Array.isArray(data.categories))data.categories=baseCategories.slice();
for(const type of ["fixed","variable","quarterly","halfyearly","annual"])for(const x of data[type])if(!x.category)x.category=inferCategory(x.name);
for(const t of data.transactions)if(!t.group)t.group=inferCategory(t.category);
const categoryOptions=selected=>[...new Set([...data.categories,selected].filter(Boolean))].map(c=>'<option value="'+esc(c)+'" '+(selected===c?"selected":"")+'>'+esc(c)+'</option>').join("");
let page="dashboard";const monthly=()=>data.transactions.filter(t=>t.date.slice(0,7)===month.value),income=()=>monthIncome(month.value),actual=()=>sum(monthly().filter(t=>t.kind==="expense")),spent=cat=>sum(monthly().filter(t=>t.kind==="expense"&&t.category===cat));
const historicalTypes=["annual","quarterly","halfyearly"];const year=()=>Number(month.value.slice(0,4));const amountAt=(x,y)=>{if(!x.amountHistory)return Number(x.amount)||0;const yrs=Object.keys(x.amountHistory).map(Number).filter(v=>v<=y).sort((a,b)=>b-a);return yrs.length?Number(x.amountHistory[yrs[0]])||0:0};const historicTotal=(type,y)=>data[type].reduce((sum,x)=>sum+amountAt(x,y),0);
for(const type of historicalTypes)for(const x of data[type])if(!x.amountHistory)x.amountHistory={"2026":Number(x.amount)||0};
if(!data.monthlySnapshots||typeof data.monthlySnapshots!=="object")data.monthlySnapshots={};
const snapshot=()=>({fixed:data.fixed.map(x=>({...x})),variable:monthlyVariable().map(x=>({...x})),income:Number(data.incomes[month.value]??data.income)||0});
const snapshotMonth=()=>{data.monthlySnapshots[month.value]=snapshot();save()};
if(!Object.keys(data.monthlySnapshots).length){data.monthlySnapshots["2026-10"]={fixed:data.fixed.map(x=>({...x})),variable:data.variable.map(x=>({...x})),income:Number(data.incomes["2026-10"]??data.income)||0};save()}
if(!Array.isArray(data.incomeEntries))data.incomeEntries=[];if(!Array.isArray(data.incomeCategories))data.incomeCategories=["Salary","Unemployment benefit","Interest","Dividends","Refund","Other income"];
if(!data.salaryHistory)data.salaryHistory={};
const salaryAt=ym=>{const k=Object.keys(data.salaryHistory).filter(x=>x<=ym).sort().pop();return k===undefined?null:Number(data.salaryHistory[k])||0};
const monthIncome=ym=>{const entries=data.incomeEntries.filter(x=>x.date.slice(0,7)===ym&&!x.isPlaceholder),salary=entries.filter(x=>x.category==="Salary"),others=entries.filter(x=>x.category!=="Salary"),rate=salaryAt(ym);return rate===null?(entries.length?sum(entries):Number(data.incomes[ym]??data.monthlySnapshots?.[ym]?.income??data.income)||0):(salary.length?sum(salary):rate)+sum(others)};
const ensureSalary=ym=>{if(!data.incomeEntries.some(x=>x.date.slice(0,7)===ym&&x.category==="Salary")){data.incomeEntries.push({id:uid(),date:ym+"-01",name:"Salary",category:"Salary",amount:salaryAt(ym)??0,isPlaceholder:true});save()}};
const monthlyVariable=()=>{if(!data.variableMonths||typeof data.variableMonths!=="object")data.variableMonths={};if(!data.variableMonths[month.value]){const prior=data.monthlySnapshots?.[month.value]?.variable;data.variableMonths[month.value]=(Array.isArray(prior)?prior:data.variable.map(x=>({...x,amount:0}))).map(x=>({...x}));save()}const entries=data.variableMonths[month.value];if(!entries.some(x=>x.name==="Cash")){entries.push({id:uid(),name:"Cash",category:"Other expenses",amount:0});save()}return entries};
const fixedAt=(x,ym)=>{const h=x.monthHistory;if(!h)return Number(x.amount)||0;const ks=Object.keys(h).filter(k=>k<=ym).sort();return ks.length?Number(h[ks[ks.length-1]])||0:0};
const fixedMonthTotal=ym=>data.fixed.reduce((n,x)=>n+fixedAt(x,ym),0);
const coveredNames=["Food + Groceries","Diesel","Eating Out"];
const cardBillsForMonth=()=>((data.cardBills ||= [])).filter(x=>x.date.slice(0,7)===month.value);
const cardSummary=()=>{const bill=Number(monthlyVariable().find(x=>x.name==="Amazon Credit Card Bill")?.amount)||0;const covered=sum(cardBillsForMonth());const residual=Math.max(0,bill-covered);const other=sum(monthlyVariable().filter(x=>x.name!=="Amazon Credit Card Bill"&&!coveredNames.includes(x.name)));return {bill,covered,residual,total:Math.max(bill,covered)+other,other,over:covered>bill};};
const btn=(text,action,id="",cls="link")=>'<button class="'+cls+'" data-action="'+action+'" data-id="'+esc(id)+'">'+esc(text)+"</button>";
const table=(head,rows)=>'<table><thead><tr>'+head.map(h=>"<th>"+esc(h)+"</th>").join("")+"</tr></thead><tbody>"+(rows||'<tr><td colspan="'+head.length+'" class="empty">No entries yet</td></tr>')+"</tbody></table>";
const card=(name,v,sub)=>'<section class="card"><label>'+esc(name)+'</label><div class="value">'+money(v)+'</div><div class="hint">'+esc(sub)+'</div></section>';
const bar=(label,v,total)=>'<div class="barhead"><span>'+esc(label)+'</span><strong>'+money(v)+" / "+money(total)+'</strong></div><div class="track"><div class="fill '+(v>total?"over":"")+'" style="width:'+Math.min(100,total>0?100*v/total:0)+'%"></div></div>';
function rowsTx(list){return table(["Date","Description","Category","Type","Amount",""],list.map(t=>'<tr><td>'+esc(t.date)+'</td><td>'+esc(t.note)+'</td><td>'+esc(t.category)+'</td><td><span class="chip">'+esc(t.kind)+'</span></td><td>'+money(t.amount)+'</td><td>'+btn("Edit","editTx",t.id)+btn("Delete","deleteTx",t.id,"link danger")+"</td></tr>").join(""))}
function dashboard(){const fixed=fixedMonthTotal(month.value),cc=cardSummary(),q=historicTotal("quarterly",year())/3,h=historicTotal("halfyearly",year())/6,annual=historicTotal("annual",year())/12,other=cc.other+q+h+annual,total=fixed+Math.max(cc.bill,cc.covered)+other;return '<div class="cards five-cards">'+card("Monthly income",income(),"Selected month")+card("Fixed expenses",fixed,"Monthly fixed payments")+card("Credit card expenses",Math.max(cc.bill,cc.covered),"Amazon card total, including itemized bills")+card("Other expenses",other,"Other monthly expenses and recurring bill shares")+card("This months savings",income()-total,"Income minus all expenses")+'</div><section class="panel"><h2>Monthly expenses by frequency</h2>'+bar("Fixed monthly",fixed,total)+bar("Amazon credit card",Math.max(cc.bill,cc.covered),total)+bar("Other monthly",cc.other,total)+bar("Quarterly share",q,total)+bar("Half-yearly share",h,total)+bar("Annual share",annual,total)+'</section><div class="notice">Other expenses include non-card monthly costs plus the monthly equivalent of quarterly, half-yearly and annual bills. Card purchases are included once.</div>'}
function transactions(){return '<section class="panel"><div class="heading"><h2>Transactions for '+esc(month.value)+'</h2>'+btn("+ Add transaction","newTx","","primary")+'</div>'+rowsTx(monthly().slice().sort((a,b)=>b.date.localeCompare(a.date)))+"</section>"}

function categoryTable(type){const a=data[type];return '<section class="panel"><div class="heading"><h2>Fixed expenses</h2>'+btn("+ Add","newItem",type,"primary")+'</div>'+table(["Category","Monthly expense",""],a.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+money(fixedAt(x,month.value))+'</td><td>'+btn("Edit","editItem",type+":"+x.id)+btn("Delete","deleteItem",type+":"+x.id,"link danger")+"</td></tr>").join(""))+'<p><strong>Total '+money(fixedMonthTotal(month.value))+"</strong></p></section>"}
function variableBudgets(){const c=cardSummary(),bill=monthlyVariable().find(x=>x.name==="Amazon Credit Card Bill"),other=monthlyVariable().filter(x=>x.name!=="Amazon Credit Card Bill"&&!coveredNames.includes(x.name)),charges=cardBillsForMonth().slice().sort((a,b)=>b.date.localeCompare(a.date));
const billRows=charges.map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.category||"Car")+'</td><td>'+money(x.amount)+'</td><td>'+btn("Edit","editCardBill",x.id)+btn("Delete","deleteCardBill",x.id,"link danger")+'</td></tr>').join("");
const otherRows=other.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+money(x.amount)+'</td><td>'+btn("Edit","editItem","variable:"+x.id)+btn("Delete","deleteItem","variable:"+x.id,"link danger")+'</td></tr>').join("");
return '<section class="panel"><div class="heading"><h2>Amazon Credit Card</h2>'+(bill?btn("Edit card total","editItem","variable:"+bill.id):btn("+ Add card total","newItem","variable","primary"))+'</div><div class="cardbill"><span>Monthly Amazon card expense</span><strong>'+money(c.bill)+'</strong></div><div class="heading" style="margin-top:20px"><h2>Individual card bills — '+esc(month.value)+'</h2>'+btn("+ Add bill","newCardBill","","primary")+'</div><p class="muted">Add diesel purchases or other identifiable card charges. Remaining card spending is automatically assigned to groceries.</p>'+table(["Date","Bill","Category","Amount",""],billRows)+'<div class="cardbreak"><span>Itemized card bills</span><strong>'+money(c.covered)+'</strong></div><div class="cardbreak"><span>Remaining groceries</span><strong>'+money(c.residual)+'</strong></div>'+(c.over?'<p class="negative">Itemized bills exceed the card total by '+money(c.covered-c.bill)+'. This excess is counted once; please review the total.</p>':'')+'</section><section class="panel"><div class="heading"><h2>Other monthly expenses</h2>'+btn("+ Add","newItem","variable","primary")+'</div>'+table(["Category","Monthly expense",""],otherRows)+'<p class="muted">These items are outside the card. Earlier diesel, grocery and restaurant budget entries remain saved but are excluded from totals to prevent double-counting.</p><p><strong>Other monthly expenses: '+money(c.other)+'</strong></p></section><section class="panel"><div class="net-total"><span>Total other monthly expenses <small>Amazon card and other expenses, without double-counting</small></span><strong>'+money(c.total)+'</strong></div></section>'}
function cardBillEdit(id){const old=id?data.cardBills.find(x=>x.id===id):null;popup(old?"Edit card bill":"Add card bill",field("date","Purchase date",old?.date||month.value+"-01","date")+field("name","Description",old?.name||"Diesel")+'<label>Reporting category<select name="category">'+categoryOptions(old?.category||"Car")+'</select></label>'+field("amount","Amount (€)",old?.amount??0,"number"),v=>{const obj={id:id||uid(),date:v.date,name:v.name,category:v.category,amount:Number(v.amount)};if(old)Object.assign(old,obj);else data.cardBills.push(obj)})}
function budgets(){const c=cardSummary();return '<div class="two">'+categoryTable("fixed")+'<div>'+variableBudgets()+'</div></div><section class="panel"><h2>Monthly expense details</h2>'+monthlyVariable().filter(x=>x.name!=="Amazon Credit Card Bill").map(x=>bar(x.name,spent(x.name),x.amount)).join("")+"</section>"}
function quarterly(){return '<section class="panel"><div class="heading"><h2>Quarterly bills</h2>'+btn("+ Add quarterly bill","newItem","quarterly","primary")+'</div>'+table(["Bill","Quarterly cost","Next due date",""],data.quarterly.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+money(amountAt(x,year()))+'</td><td>'+esc(x.due||"—")+'</td><td>'+btn("Edit","editItem","quarterly:"+x.id)+btn("Delete","deleteItem","quarterly:"+x.id,"link danger")+"</td></tr>").join(""))+'<p><strong>Quarterly total: '+money(historicTotal('quarterly',year()))+' · Monthly reserve: '+money(historicTotal('quarterly',year())/3)+' · Annual equivalent: '+money(historicTotal('quarterly',year())*4)+'</strong></p><div class="notice">Add recurring bills charged every three months. The due date is editable and serves as a reference; it does not automatically create a transaction.</div></section>'}
function halfyearly(){return '<section class="panel"><div class="heading"><h2>Half-yearly expenses</h2>'+btn("+ Add expense","newItem","halfyearly","primary")+'</div>'+table(["Expense","Six-month cost","Next due date",""],data.halfyearly.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+money(amountAt(x,year()))+'</td><td>'+esc(x.due||"—")+'</td><td>'+btn("Edit","editItem","halfyearly:"+x.id)+btn("Delete","deleteItem","halfyearly:"+x.id,"link danger")+"</td></tr>").join(""))+'<p><strong>Half-yearly total: '+money(historicTotal('halfyearly',year()))+' · Monthly reserve: '+money(historicTotal('halfyearly',year())/6)+' · Annual equivalent: '+money(historicTotal('halfyearly',year())*2)+'</strong></p><div class="notice">For expenses paid every six months. Due dates are reference dates and do not create transactions automatically.</div></section>'}
function annual(){return '<section class="panel"><div class="heading"><h2>Annual insurance & other bills</h2>'+btn("+ Add bill","newItem","annual","primary")+'</div>'+table(["Bill","Yearly cost","Reference due date",""],data.annual.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+money(amountAt(x,year()))+'</td><td>'+esc(x.due||"—")+'</td><td>'+btn("Edit","editItem","annual:"+x.id)+btn("Delete","deleteItem","annual:"+x.id,"link danger")+"</td></tr>").join(""))+'<p><strong>Annual total: '+money(historicTotal('annual',year()))+' · Monthly reserve: '+money(historicTotal('annual',year())/12)+'</strong></p><div class="notice">Due dates are reference dates. Review dates imported from month-only entries in your spreadsheet. Check the annual and monthly Radio entries for overlap.</div></section>'}
const accountMonth=()=>{if(!data.accountMonths||typeof data.accountMonths!=="object")data.accountMonths={};if(!data.accountMonths[month.value]){const earlier=Object.keys(data.accountMonths).filter(x=>x<month.value).sort().pop();data.accountMonths[month.value]=(earlier?data.accountMonths[earlier]:data.accounts).map(x=>({...x}));save()}return data.accountMonths[month.value]};
function accounts(){const entries=accountMonth();const [yy,mm]=month.value.split("-").map(Number);const previous=new Date(Date.UTC(yy,mm-2,1)).toISOString().slice(0,7);const prior=data.accountMonths?.[previous];const previousById=new Map((prior||[]).map(x=>[x.id,x]));const pct=(now,was)=>{if(was===0)return now===0?"0.0%":"New";const p=(now-was)/Math.abs(was)*100;return (p>0?"+":"")+p.toFixed(1)+"%"};const change=(now,was)=>was===undefined?'<span class="muted">—</span>':'<span class="'+(now>was?"positive":now<was?"negative":"muted")+'">'+pct(now,was)+'</span>';
const total=sum(entries,"balance"),priorTotal=prior?sum(prior,"balance"):undefined;
return '<div class="cards">'+card("Total account balances",total,"Saved balances for "+month.value)+'</div><section class="panel"><h2>Change from '+esc(previous)+'</h2><p><strong>Total savings change: '+change(total,priorTotal)+'</strong></p><div class="notice">Changes compare balances with the immediately preceding calendar month. — means no saved balance for that month; New means the earlier balance was zero.</div></section><section class="panel"><div class="heading"><h2>Accounts & savings — '+esc(month.value)+'</h2>'+btn("+ Add account","newItem","accounts","primary")+'</div>'+table(["Account","Balance","Previous month","Change",""],entries.map(x=>{const p=previousById.get(x.id);return '<tr><td>'+esc(x.name)+'</td><td>'+money(x.balance)+'</td><td>'+(p?money(p.balance):"—")+'</td><td>'+change(Number(x.balance)||0,p?Number(p.balance)||0:undefined)+'</td><td>'+btn("Edit","editItem","accounts:"+x.id)+btn("Delete","deleteItem","accounts:"+x.id,"link danger")+'</td></tr>'}).join(""))+'</section>'}
function incomePage(){ensureSalary(month.value);const entries=data.incomeEntries.filter(x=>x.date.slice(0,7)===month.value);const rows=entries.map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.category)+'</td><td>'+money(x.amount)+'</td><td>'+btn("Edit","editIncome",x.id)+btn("Delete","deleteIncome",x.id,"link danger")+'</td></tr>').join("");return '<section class="panel"><div class="heading"><h2>Income — '+esc(month.value)+'</h2>'+btn("+ Add income","newIncome","","primary")+'</div>'+table(["Date","Source","Category","Amount",""],rows)+'<p><strong>Total income: '+money(income())+'</strong></p><div class="notice">'+(entries.length?"Monthly income is calculated from the entries above. Existing reference income remains saved but is not added again.":"No itemized income for this month. The dashboard continues using the existing monthly income reference until you add an entry.")+'</div></section><section class="panel"><div class="heading"><h2>Income categories</h2>'+btn("+ Add category","newIncomeCategory","","primary")+'</div><p>'+data.incomeCategories.map(c=>'<span class="chip" style="display:inline-block;margin:4px">'+esc(c)+' '+btn("×","removeIncomeCategory",c,"link danger")+'</span>').join("")+'</p></section>'}
function incomeEdit(id){const old=id?data.incomeEntries.find(x=>x.id===id):null;popup(old?"Edit income":"Add income",field("date","Date",old?.date||month.value+"-01","date")+field("name","Income source",old?.name||"")+ '<label>Category<select name="category">'+data.incomeCategories.map(c=>'<option value="'+esc(c)+'" '+(c===old?.category?"selected":"")+'>'+esc(c)+'</option>').join("")+'</select></label>'+field("amount","Amount (€)",old?.amount??0,"number"),v=>{const obj={id:id||uid(),date:v.date,name:v.name,category:v.category,amount:Number(v.amount),isPlaceholder:false};if(old)Object.assign(old,obj);else data.incomeEntries.push(obj)})}
function settings(){return '<section class="panel"><h2>Default salary</h2><div class="stack"><label>Monthly salary (€)<input id="salaryAmount" type="number" min="0" step=".01" value="'+esc(salaryAt(month.value)??0)+'"></label><label>Effective from<input id="salaryEffective" type="month" value="'+esc(month.value)+'"></label>'+btn("Save default salary","saveSalary","","primary")+'</div><p class="muted">Applies from the selected month onward. Earlier salary amounts remain unchanged.</p></section>'+'<div class="two"><section class="panel"><h2>Income settings</h2><div class="stack"><label>Default monthly income<input id="defaultIncome" type="number" min="0" step=".01" value="'+esc(data.income)+'"></label><label>Income for '+esc(month.value)+'<input id="currentIncome" type="number" min="0" step=".01" value="'+esc(income())+'"></label>'+btn("Save income","saveIncome","","primary")+'</div><div class="notice">The default €4,437 came from the spreadsheet. Update it to reflect your current circumstances.</div></section><section class="panel"><h2>Reporting categories</h2><p class="muted">Used in all expense category dropdowns.</p><div class="stack">'+data.categories.map(c=>'<div>'+esc(c)+' '+btn("Remove","removeCategory",c,"link danger")+'</div>').join("")+btn("+ Add category","addCategory","","primary")+'</div></section><section class="panel"><h2>Backup & privacy</h2><p class="muted">Transactions remain in this browser. The GitHub repository contains only app code; there is no cloud sync or banking connection.</p><div class="stack">'+btn("Export JSON backup","export","","primary")+btn("Import JSON backup","import")+btn("Reset all data","reset","","link danger")+'</div></section></div>'}
function yearlyPie(totals){const colors=["#3465db","#16a085","#f59e0b","#8b5cf6","#ef4444","#0ea5e9","#84cc16","#ec4899","#64748b","#d97706","#14b8a6","#6366f1"];const entries=Object.entries(totals).filter(x=>Number(x[1])>0).sort((a,b)=>b[1]-a[1]);const total=entries.reduce((n,x)=>n+Number(x[1]),0);if(!total)return '<section class="panel"><h2>Yearly expenses by category</h2><p class="muted">Enter expenses to see the breakdown.</p></section>';let used=0;const slices=entries.map(([name,value],i)=>{const start=used;used+=Number(value)/total*100;return colors[i%colors.length]+" "+start.toFixed(4)+"% "+used.toFixed(4)+"%"});const legend=entries.map(([name,value],i)=>'<div class="pie-line"><span class="pie-dot" style="background:'+colors[i%colors.length]+'"></span><span>'+esc(name)+'</span><strong>'+money(value)+' · '+(value/total*100).toFixed(1)+'%</strong></div>').join("");return '<section class="panel"><h2>Expense share by category</h2><p class="muted">Percentage of expenses for months entered in the selected year</p><div class="pie-layout"><div class="pie" style="background:conic-gradient('+slices.join(",")+')"><div class="pie-center"><span>Total expenses</span><strong>'+money(total)+'</strong></div></div><div class="pie-legend">'+legend+'</div></div></section>'}
let selectedDashboardYear=null;
function yearly(){
const y=String(selectedDashboardYear||Number(month.value.slice(0,4))),yr=Number(y),totals={},details=[];
const add=(cat,n)=>{totals[cat]=(totals[cat]||0)+(Number(n)||0)};
let fixed=0;
for(let m=1;m<=12;m++){const ym=y+"-"+String(m).padStart(2,"0");for(const x of data.fixed){const v=fixedAt(x,ym);fixed+=v;add(x.category||inferCategory(x.name),v)}}
let recurring=0;
for(const [type,factor] of [["quarterly",4],["halfyearly",2],["annual",1]]){
 for(const x of data[type]){const cost=amountAt(x,yr)*factor;recurring+=cost;add(x.category||inferCategory(x.name),cost)}
}
let yearlyCard=0,variableOther=0,yearIncome=0;
for(let m=1;m<=12;m++){
 const ym=y+"-"+String(m).padStart(2,"0");
 const entries=data.incomeEntries.filter(x=>x.date.slice(0,7)===ym&&!x.isPlaceholder);
 const manualSalary=entries.filter(x=>x.category==="Salary");
 const salary=manualSalary.length?sum(manualSalary):(salaryAt(ym)??0);
 const extra=sum(entries.filter(x=>x.category!=="Salary"));
 yearIncome+=salary+extra;
}
const months=Object.keys(data.monthlySnapshots||{}).filter(x=>x.startsWith(y+"-")).sort();
const excluded=["Food + Groceries","Diesel","Eating Out","Amazon Credit Card Bill"];
for(const ym of months){
const snap=data.monthlySnapshots[ym],variable=data.variableMonths?.[ym]||snap.variable||[];
const card=Number(variable.find(x=>x.name==="Amazon Credit Card Bill")?.amount)||0;
const charges=(data.cardBills||[]).filter(x=>x.date.slice(0,7)===ym),charged=sum(charges),cardCost=Math.max(card,charged);
let otherMonth=0;
for(const x of variable)if(!excluded.includes(x.name)){const cost=Number(x.amount)||0;otherMonth+=cost;add(x.category||inferCategory(x.name),cost)}
for(const x of charges)add(x.category||inferCategory(x.name),Number(x.amount)||0);
add("Food",Math.max(0,card-charged));
yearlyCard+=cardCost;variableOther+=otherMonth;
details.push('<tr><td>'+esc(ym)+'</td><td>'+money(cardCost)+'</td><td>'+money(otherMonth)+'</td></tr>')
}
const other=recurring+variableOther,total=fixed+yearlyCard+other;
const rows=Object.entries(totals).filter(x=>x[1]!==0).sort((a,b)=>b[1]-a[1]).map(([cat,value])=>'<tr><td>'+esc(cat)+'</td><td>'+money(value)+'</td></tr>').join("");
const years=[...new Set([yr,...Object.keys(data.monthlySnapshots||{}).map(k=>Number(k.slice(0,4))),...Object.keys(data.variableMonths||{}).map(k=>Number(k.slice(0,4))),...Object.keys(data.salaryHistory||{}).map(k=>Number(k.slice(0,4))),...Object.keys(data.incomes||{}).map(k=>Number(k.slice(0,4))),2026])].filter(Number.isInteger).sort((a,b)=>b-a);for(let k=yr-2;k<=yr+2;k++)if(!years.includes(k))years.push(k);years.sort((a,b)=>b-a);const picker='<section class="panel"><label for="dashboardYear">Select year </label><select id="dashboardYear">'+years.map(n=>'<option value="'+n+'" '+(n===yr?"selected":"")+'>'+n+'</option>').join("")+'</select></section>';
return picker+'<div class="cards five-cards">'+card("Yearly income",yearIncome,"12 months of salary + entered additional income")+card("Fixed expenses",fixed,"Monthly fixed expenses × 12")+card("Credit card expenses",yearlyCard,"Only entered months")+card("Other expenses",other,"Full-year recurring bills + entered variable expenses")+card("This years savings",yearIncome-total,"Income minus all expenses")+'</div><div class="two"><section class="panel"><h2>Expenses by category — '+esc(y)+'</h2>'+table(["Category","Yearly expenses"],rows)+'</section><section class="panel"><h2>Variable expenses entered — '+esc(y)+'</h2>'+table(["Month","Credit card","Other variable"],details.join(""))+'</section></div>'+yearlyPie(totals)+'<div class="notice">Fixed expenses are counted for 12 months. Quarterly, half-yearly and annual bills use their full-year equivalents. Credit card and other variable expenses accumulate only as you enter each month. Yearly income includes salary applicable to all 12 months, including effective-month changes, plus additional income entries. Manually entered salary overrides the default for that month.</div>'
}
const pages={dashboard,yearly,income:incomePage,budgets,quarterly,halfyearly,annual,accounts,settings};
function render(){document.getElementById("title").textContent=({dashboard:"Monthly Dashboard",yearly:"Yearly Dashboard",income:"Income",budgets:"Monthly expenses",quarterly:"Quarterly bills",halfyearly:"Half-yearly expenses",annual:"Annual bills",accounts:"Accounts & savings",settings:"Settings & backup"})[page];document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));document.getElementById("view").innerHTML=pages[page]()}
function field(name,label,val,type="text"){return '<label>'+esc(label)+'<input name="'+name+'" type="'+type+'" '+(type==="number"?'min="0" step=".01"':"")+' required value="'+esc(val??"")+'"></label>'}
function popup(title,fields,cb){document.getElementById("fields").innerHTML="<h2>"+esc(title)+'</h2><div class="stack">'+fields+"</div>";document.getElementById("dialog").showModal();document.getElementById("form").onsubmit=e=>{e.preventDefault();const fd=Object.fromEntries(new FormData(e.target));if(cb(fd)!==false){snapshotMonth();document.getElementById("dialog").close();render()}}}
function itemEdit(type,id){const old=id?(type==="accounts"?accountMonth():type==="variable"?monthlyVariable():data[type]).find(x=>x.id===id):null,account=type==="accounts",historical=historicalTypes.includes(type),isFixed=type==="fixed",selected=year();
popup(old?"Edit entry":"New entry",field("name","Name",old?.name||"")+field("amount",account?"Account balance (€)":type==="annual"?"Annual cost (€)":type==="quarterly"?"Quarterly cost (€)":type==="halfyearly"?"Six-month cost (€)":"Monthly expense (€)",old?(account?old.balance:historical?amountAt(old,selected):isFixed?fixedAt(old,month.value):old.amount):0,"number")+(account?"":'<label>Reporting category<select name="group">'+categoryOptions(old?.category||inferCategory(old?.name||""))+'</select></label>')+(isFixed?'<div class="notice">Changes take effect from '+month.value+' onward; prior months stay unchanged.</div>':"")+(historical?'<div class="notice">The new amount takes effect from '+selected+'. Earlier years are preserved.</div>':"")+(historicalTypes.includes(type)?field("due","Reference due date",old?.due||new Date().toISOString().slice(0,10),"date"):""),v=>{if((type==="accounts"?accountMonth():type==="variable"?monthlyVariable():data[type]).some(x=>x.name.toLowerCase()===v.name.trim().toLowerCase()&&x.id!==id)){alert("Please use a unique name.");return false}const obj={id:id||uid(),name:v.name.trim(),[account?"balance":"amount"]:Number(v.amount),...(account?{}:{category:v.group})};if(historical){obj.amountHistory={...(old?.amountHistory||{}),[selected]:Number(v.amount)};if(old)obj.amount=old.amount;}if(isFixed){obj.monthHistory={...(old?.monthHistory||{"2026-01":Number(old?.amount)||0}),[month.value]:Number(v.amount)};if(old)obj.amount=old.amount;}if(historicalTypes.includes(type))obj.due=v.due;if(old)Object.assign(old,obj);else (account?accountMonth():type==="variable"?monthlyVariable():data[type]).push(obj)})}
function txEdit(id){const t=id?data.transactions.find(x=>x.id===id):null;const cats=[...new Set([...data.fixed,...data.variable].map(x=>x.name).concat(["Salary / income","Other"]))];if(t?.category&&!cats.includes(t.category))cats.push(t.category);popup(t?"Edit transaction":"Add transaction",field("date","Date",t?.date||month.value+"-01","date")+'<label>Type<select name="kind"><option value="expense" '+(t?.kind==="expense"?"selected":"")+'>Expense</option><option value="income" '+(t?.kind==="income"?"selected":"")+'>Income</option></select></label><label>Category<select name="category">'+cats.map(c=>'<option '+(t?.category===c?"selected":"")+'>'+esc(c)+"</option>").join("")+"</select></label>"+'<label>Reporting category<select name="group">'+categoryOptions(t?.group||inferCategory(t?.category||""))+'</select></label>'+field("amount","Amount (€)",t?.amount??0,"number")+field("note","Description",t?.note||""),v=>{const obj={id:id||uid(),date:v.date,kind:v.kind,category:v.category,group:v.group,amount:Number(v.amount),note:v.note};if(t)Object.assign(t,obj);else data.transactions.push(obj)})}
document.getElementById("nav").onclick=e=>{const b=e.target.closest("[data-page]");if(b){page=b.dataset.page;render()}};

document.getElementById("cancel").onclick=()=>document.getElementById("dialog").close();
document.getElementById("month").onchange=render;
document.getElementById("view").addEventListener("change",e=>{if(e.target.id==="dashboardYear"){selectedDashboardYear=Number(e.target.value);render()}});
document.getElementById("view").onclick=e=>{const b=e.target.closest("[data-action]");if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==="go"){page=id;return render()}if(a==="newIncome")return incomeEdit();if(a==="editIncome")return incomeEdit(id);if(a==="deleteIncome"){if(confirm("Delete this income entry?")){data.incomeEntries=data.incomeEntries.filter(x=>x.id!==id);save();render()}return}if(a==="newIncomeCategory"){const c=prompt("Income category name");if(c&&c.trim()&&!data.incomeCategories.includes(c.trim())){data.incomeCategories.push(c.trim());save();render()}return}if(a==="removeIncomeCategory"){if(data.incomeEntries.some(x=>x.category===id))return alert("This category is used by saved income entries.");data.incomeCategories=data.incomeCategories.filter(x=>x!==id);save();render();return}if(a==="newCardBill")return cardBillEdit();if(a==="editCardBill")return cardBillEdit(id);if(a==="deleteCardBill"){if(confirm("Delete this card bill?")){data.cardBills=data.cardBills.filter(x=>x.id!==id);snapshotMonth();render()}return}if(a==="editTx")return txEdit(id);if(a==="deleteTx"){if(confirm("Delete this transaction?")){data.transactions=data.transactions.filter(x=>x.id!==id);save();render()}return}if(a==="newItem")return itemEdit(id);if(a==="editItem"){const [type,key]=id.split(":");return itemEdit(type,key)}if(a==="deleteItem"){const [type,key]=id.split(":");if(confirm("Delete this entry?")){if(type==="accounts")data.accountMonths[month.value]=accountMonth().filter(x=>x.id!==key);else if(type==="variable")data.variableMonths[month.value]=monthlyVariable().filter(x=>x.id!==key);else data[type]=data[type].filter(x=>x.id!==key);snapshotMonth();render()}return}if(a==="addCategory"){const n=prompt("New reporting category");if(n&&n.trim()&&!data.categories.some(c=>c.toLowerCase()===n.trim().toLowerCase())){data.categories.push(n.trim());save();render()}return}if(a==="removeCategory"){if(confirm("Remove from dropdown? Existing expenses retain this category.")){data.categories=data.categories.filter(c=>c!==id);save();render()}return}if(a==="saveSalary"){const n=Number(document.getElementById("salaryAmount").value),ym=document.getElementById("salaryEffective").value;if(!Number.isFinite(n)||n<0||ym.length!==7)return alert("Invalid salary or month");data.salaryHistory[ym]=n;save();render();return}if(a==="saveIncome"){const f=Number(document.getElementById("defaultIncome").value),m=Number(document.getElementById("currentIncome").value);if(!Number.isFinite(f)||!Number.isFinite(m)||f<0||m<0)return alert("Invalid income");data.income=f;data.incomes[month.value]=m;snapshotMonth();render()}if(a==="export"){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"})),link=document.createElement("a");link.href=url;link.download="monthly-expenses-backup-"+new Date().toISOString().slice(0,10)+".json";link.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}if(a==="import")document.getElementById("import").click();if(a==="reset"&&confirm("Delete all locally saved budgets, transactions and balances? Export a backup first.")){data=structuredClone(defaults);save();render()}};
document.getElementById("import").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d||!["fixed","variable","quarterly","halfyearly","annual","accounts","transactions"].every(k=>Array.isArray(d[k])))throw Error("Invalid backup");if(confirm("Replace all current data with this backup?")){data=d;if(!data.variableMonths||typeof data.variableMonths!=="object")data.variableMonths={};if(!Array.isArray(data.cardBills))data.cardBills=[];if(!Array.isArray(data.incomeEntries))data.incomeEntries=[];if(!Array.isArray(data.incomeCategories))data.incomeCategories=structuredClone(defaults.incomeCategories);if(!data.salaryHistory)data.salaryHistory={};if(!data.accountMonths||typeof data.accountMonths!=="object")data.accountMonths={};save();render()}}catch(err){alert("Import failed: "+err.message)}finally{e.target.value=""}};render();
})();
} catch (error) {
 const target=document.getElementById("view");
 if(target)target.innerHTML='<section class="panel"><h2>App could not load</h2><p>There is a problem reading the locally saved expenses. Your saved data has not been deleted.</p><p id="startupError" style="color:#a12e3b"></p><button id="rescueBackup" class="primary">Download my saved data</button><p class="muted">Please share the error message to get the app working again. Do not clear browser data.</p></section>';
 const msg=document.getElementById("startupError");if(msg)msg.textContent=String(error&&error.message||error);
 const backup=document.getElementById("rescueBackup");if(backup)backup.onclick=()=>{const raw=localStorage.getItem("monthly-expenses-naikea-v1");if(raw===null)return alert("No saved data found.");const link=document.createElement("a"),url=URL.createObjectURL(new Blob([raw],{type:"application/json"}));link.href=url;link.download="monthly-expenses-recovery.json";link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
}
</script></body></html>
