<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>Monthly Expenses</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#162238;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #d9e2ed;background:white;color:#253652;border-radius:9px;padding:10px 14px}button:hover{background:#eef4ff}.primary{background:#3465db;color:white;border-color:#3465db}.primary:hover{background:#2454c4}aside{width:240px;background:#101d35;color:#c9d5ed;position:fixed;height:100vh;padding:25px 16px;display:flex;flex-direction:column;gap:30px}aside h2{color:white;margin:0;font-size:22px}aside small{color:#92a2bc}nav{display:grid;gap:7px}nav button{color:#d1ddf2;text-align:left;background:transparent;border:0;width:100%}nav button.active,nav button:hover{background:#273b60;color:white}.foot{margin-top:auto;font-size:12px;color:#8798b6}main{margin-left:240px;padding:32px;max-width:1500px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}header h1{margin:4px 0;font-size:29px}header p{color:#687995;margin:0}header label{font-size:13px;color:#65748b}input,select{padding:10px;border:1px solid #d3deea;border-radius:8px;background:white;color:#182b47;max-width:100%}input[type=month]{margin-left:8px}.topactions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card,.panel{background:white;border:1px solid #e1e9f2;border-radius:14px;padding:22px;box-shadow:0 4px 15px #102c4d07}.card label{font-size:13px;color:#62748e}.value{font-size:27px;font-weight:750;letter-spacing:-.7px;margin:10px 0}.hint{color:#8794a6;font-size:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.panel{margin-top:18px;overflow:auto}.panel h2{font-size:18px;margin:0 0 16px}.heading{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.heading h2{margin:0}table{border-collapse:collapse;width:100%;min-width:530px;font-size:14px}th{text-align:left;color:#7889a3;font-size:12px;font-weight:650}td,th{padding:13px 9px;border-bottom:1px solid #edf1f5}td:last-child{text-align:right;white-space:nowrap}.link{border:0;padding:6px;color:#285cce}.danger{color:#ce414e}.muted{font-size:13px;color:#7787a1}.barhead{display:flex;justify-content:space-between;font-size:13px;gap:8px;margin:17px 0 7px}.track{background:#eaf0fa;border-radius:20px;height:8px;overflow:hidden}.fill{height:100%;background:#4478e8;border-radius:20px}.over{background:#e35c64}.notice{background:#f2f6fc;border-radius:9px;padding:13px;color:#647690;font-size:13px;line-height:1.6;margin-top:15px}.stack{display:grid;gap:15px}.stack label{display:grid;gap:6px;color:#5b6f89;font-size:13px}.stack input,.stack select{width:100%}dialog{border:0;border-radius:16px;width:min(450px,92vw);padding:25px;box-shadow:0 25px 80px #0c1b3544}dialog::backdrop{background:#09152999}dialog h2{margin:0 0 20px}.dialogbuttons{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.positive{color:#128b65}.negative{color:#c74959}.empty{color:#8d9cb0;padding:24px;text-align:center}.chip{font-size:12px;padding:5px 8px;background:#f0f4fa;border-radius:8px}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:720px){aside{position:static;height:auto;width:auto;padding:15px;gap:10px}aside h2{font-size:20px}nav{display:flex;overflow:auto}nav button{white-space:nowrap;width:auto}.foot{display:none}main{margin:0;padding:18px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:15px}.value{font-size:21px}header h1{font-size:24px}}
.included-name{padding-left:22px;color:#436184}.included-tag{display:inline-block;background:#edf3ff;color:#3561b3;border-radius:6px;padding:3px 7px;margin-left:7px;font-size:11px;font-weight:650}.cardbill,.net-total{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#edf4ff;border-radius:10px;padding:16px;color:#173a7c}.cardbill strong,.net-total strong{font-size:24px}.net-total small{display:block;color:#6a7e9b;font-size:12px;margin-top:4px;font-weight:400}.cardbreak{display:flex;justify-content:space-between;gap:12px;padding:12px 6px;border-bottom:1px solid #eef1f5;font-size:14px}.negative{color:#bb3b46;font-size:13px}</style></head>
<body><aside><div><h2>€ Monthly Expenses</h2><small>Personal finance tracker</small></div><nav id="nav"><button data-page="dashboard" class="active">Monthly Dashboard</button><button data-page="yearly">Yearly Dashboard</button><button data-page="budgets">Budgets</button><button data-page="quarterly">Quarterly bills</button><button data-page="halfyearly">Half-yearly expenses</button><button data-page="annual">Annual bills</button><button data-page="accounts">Accounts</button><button data-page="settings">Settings & backup</button></nav><div class="foot">Private, local browser storage.<br>Export backups regularly.</div></aside>
<main><header><div><h1 id="title">Dashboard</h1><p>Based on your Monthly expenses spreadsheet</p></div><div class="topactions"><label>Month <input id="month" type="month"></label></div></header><div id="view"></div></main>
<dialog id="dialog"><form id="form"><div id="fields"></div><div class="dialogbuttons"><button type="button" id="cancel">Cancel</button><button type="submit" class="primary">Save</button></div></form></dialog><input type="file" id="import" accept=".json" hidden>
<script>
(function(){
"use strict";
const KEY="monthly-expenses-naikea-v1",uid=()=>Math.random().toString(36).slice(2,11),money=n=>new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR"}).format(Number(n)||0),sum=(a,k="amount")=>a.reduce((s,x)=>s+(Number(x[k])||0),0),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),item=(name,amount)=>({id:uid(),name,amount});
const defaults={income:4437,incomes:{},fixed:[item("Rent",1000),item("Internet",40),item("Electricity",60),item("Gym",25),item("Radio",18.36),item("Bank",7),item("Monoxidil",20),item("Netflix",6)],variable:[item("Food + Groceries",200),item("Diesel",100),item("Eating Out",100),item("Pleasure",100),item("Aai Medicines",100),item("India Trip",0),item("Amazon Shopping",0),item("Amazon Credit Card Bill",0)],cardBills:[],quarterly:[],halfyearly:[],annual:[{...item("Liability",78.39),due:"2026-05-21"},{...item("Car HUK 24",912.62),due:"2026-09-01"},{...item("Car Municipality",238),due:"2026-09-01"},{...item("Car Inspection TÜV + Tire replacement",0),due:"2026-03-01"},{...item("Radio",212.32),due:"2026-12-15"}],accounts:["Active Account","Flexgeld Deutsche Bank","Deposit","Wise","Scalable","Scalable Saving"].map(name=>({id:uid(),name,balance:0})),transactions:[]};
let data;try{data=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch{data=structuredClone(defaults)}Object.keys(defaults).forEach(k=>{if(data[k]===undefined)data[k]=structuredClone(defaults[k])});if(!data.variable.some(x=>x.name==="Amazon Credit Card Bill"))data.variable.push(item("Amazon Credit Card Bill",0));const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const month=document.getElementById("month");month.value=new Date().toLocaleDateString("en-CA").slice(0,7);if(!/^\d{4}-\d{2}$/.test(month.value))month.value=new Date().toISOString().slice(0,7);const baseCategories=["Rent","Internet","Electricity","Car","Gym","Monoxidil","Insurance","Food","Leisure","Travel","Education","Healthcare","Shopping","Banking","Subscriptions","Other expenses"];
const inferCategory=n=>{n=String(n||"").toLowerCase();for(const [rx,c] of [[/rent/,"Rent"],[/internet/,"Internet"],[/electricity/,"Electricity"],[/diesel|car|tüv|tire|municipality/,"Car"],[/gym/,"Gym"],[/monoxidil|minoxidil/,"Monoxidil"],[/insurance|liability|huk/,"Insurance"],[/grocer|food|eating out|restaurant/,"Food"],[/pleasure/,"Leisure"],[/trip/,"Travel"],[/education|course/,"Education"],[/medicine/,"Healthcare"],[/amazon|shopping/,"Shopping"],[/bank/,"Banking"],[/netflix|radio/,"Subscriptions"]])if(rx.test(n))return c;return "Other expenses"};
if(!Array.isArray(data.categories))data.categories=baseCategories.slice();
for(const type of ["fixed","variable","quarterly","halfyearly","annual"])for(const x of data[type])if(!x.category)x.category=inferCategory(x.name);
for(const t of data.transactions)if(!t.group)t.group=inferCategory(t.category);
const categoryOptions=selected=>[...new Set([...data.categories,selected].filter(Boolean))].map(c=>'<option value="'+esc(c)+'" '+(selected===c?"selected":"")+'>'+esc(c)+'</option>').join("");
let page="dashboard";const monthly=()=>data.transactions.filter(t=>t.date.slice(0,7)===month.value),income=()=>data.incomes[month.value]??data.income,actual=()=>sum(monthly().filter(t=>t.kind==="expense")),spent=cat=>sum(monthly().filter(t=>t.kind==="expense"&&t.category===cat));
const historicalTypes=["annual","quarterly","halfyearly"];const year=()=>Number(month.value.slice(0,4));const amountAt=(x,y)=>{if(!x.amountHistory)return Number(x.amount)||0;const yrs=Object.keys(x.amountHistory).map(Number).filter(v=>v<=y).sort((a,b)=>b-a);return yrs.length?Number(x.amountHistory[yrs[0]])||0:0};const historicTotal=(type,y)=>data[type].reduce((sum,x)=>sum+amountAt(x,y),0);
for(const type of historicalTypes)for(const x of data[type])if(!x.amountHistory)x.amountHistory={"2026":Number(x.amount)||0};
const coveredNames=["Food + Groceries","Diesel","Eating Out"];
const cardBillsForMonth=()=>((data.cardBills ||= [])).filter(x=>x.date.slice(0,7)===month.value);
const cardSummary=()=>{const bill=Number(data.variable.find(x=>x.name==="Amazon Credit Card Bill")?.amount)||0;const covered=sum(cardBillsForMonth());const residual=Math.max(0,bill-covered);const other=sum(data.variable.filter(x=>x.name!=="Amazon Credit Card Bill"&&!coveredNames.includes(x.name)));return {bill,covered,residual,total:Math.max(bill,covered)+other,other,over:covered>bill};};
const btn=(text,action,id="",cls="link")=>'<button class="'+cls+'" data-action="'+action+'" data-id="'+esc(id)+'">'+esc(text)+"</button>";
const table=(head,rows)=>'<table><thead><tr>'+head.map(h=>"<th>"+esc(h)+"</th>").join("")+"</tr></thead><tbody>"+(rows||'<tr><td colspan="'+head.length+'" class="empty">No entries yet</td></tr>')+"</tbody></table>";
const card=(name,v,sub)=>'<section class="card"><label>'+esc(name)+'</label><div class="value">'+money(v)+'</div><div class="hint">'+esc(sub)+'</div></section>';
const bar=(label,v,total)=>'<div class="barhead"><span>'+esc(label)+'</span><strong>'+money(v)+" / "+money(total)+'</strong></div><div class="track"><div class="fill '+(v>total?"over":"")+'" style="width:'+Math.min(100,total>0?100*v/total:0)+'%"></div></div>';
function rowsTx(list){return table(["Date","Description","Category","Type","Amount",""],list.map(t=>'<tr><td>'+esc(t.date)+'</td><td>'+esc(t.note)+'</td><td>'+esc(t.category)+'</td><td><span class="chip">'+esc(t.kind)+'</span></td><td>'+money(t.amount)+'</td><td>'+btn("Edit","editTx",t.id)+btn("Delete","deleteTx",t.id,"link danger")+"</td></tr>").join(""))}
function dashboard(){const f=sum(data.fixed),v=cardSummary().total,q=historicTotal("quarterly",year())/3,h=historicTotal("halfyearly",year())/6,a=historicTotal("annual",year())/12,total=f+v+q+h+a;return '<div class="cards">'+card("Monthly income",income(),"Selected month")+card("Monthly expenses",total,"Includes monthly share of recurring bills")+card("Amazon credit card",cardSummary().bill,"Groceries and itemized card purchases included")+card("Income minus expenses",income()-total,"Monthly balance")+'</div><section class="panel"><h2>Monthly expenses by frequency</h2>'+bar("Fixed monthly",f,total)+bar("Other monthly",v,total)+bar("Quarterly share",q,total)+bar("Half-yearly share",h,total)+bar("Annual share",a,total)+'</section><div class="notice">Amounts are expenses, not budgets. Quarterly, half-yearly and annual charges are divided across months here to show the monthly equivalent; individual Amazon card bills are included within the card total.</div>'}
function transactions(){return '<section class="panel"><div class="heading"><h2>Transactions for '+esc(month.value)+'</h2>'+btn("+ Add transaction","newTx","","primary")+'</div>'+rowsTx(monthly().slice().sort((a,b)=>b.date.localeCompare(a.date)))+"</section>"}

function categoryTable(type){const a=data[type];return '<section class="panel"><div class="heading"><h2>Fixed expenses</h2>'+btn("+ Add","newItem",type,"primary")+'</div>'+table(["Category","Monthly expense",""],a.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+money(x.amount)+'</td><td>'+btn("Edit","editItem",type+":"+x.id)+btn("Delete","deleteItem",type+":"+x.id,"link danger")+"</td></tr>").join(""))+'<p><strong>Total '+money(sum(a))+"</strong></p></section>"}
function variableBudgets(){const c=cardSummary(),bill=data.variable.find(x=>x.name==="Amazon Credit Card Bill"),other=data.variable.filter(x=>x.name!=="Amazon Credit Card Bill"&&!coveredNames.includes(x.name)),charges=cardBillsForMonth().slice().sort((a,b)=>b.date.localeCompare(a.date));
const billRows=charges.map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.category||"Car")+'</td><td>'+money(x.amount)+'</td><td>'+btn("Edit","editCardBill",x.id)+btn("Delete","deleteCardBill",x.id,"link danger")+'</td></tr>').join("");
const otherRows=other.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+money(x.amount)+'</td><td>'+btn("Edit","editItem","variable:"+x.id)+btn("Delete","deleteItem","variable:"+x.id,"link danger")+'</td></tr>').join("");
return '<section class="panel"><div class="heading"><h2>Amazon Credit Card</h2>'+(bill?btn("Edit card total","editItem","variable:"+bill.id):btn("+ Add card total","newItem","variable","primary"))+'</div><div class="cardbill"><span>Monthly Amazon card expense</span><strong>'+money(c.bill)+'</strong></div><div class="heading" style="margin-top:20px"><h2>Individual card bills — '+esc(month.value)+'</h2>'+btn("+ Add bill","newCardBill","","primary")+'</div><p class="muted">Add diesel purchases or other identifiable card charges. Remaining card spending is automatically assigned to groceries.</p>'+table(["Date","Bill","Category","Amount",""],billRows)+'<div class="cardbreak"><span>Itemized card bills</span><strong>'+money(c.covered)+'</strong></div><div class="cardbreak"><span>Remaining groceries</span><strong>'+money(c.residual)+'</strong></div>'+(c.over?'<p class="negative">Itemized bills exceed the card total by '+money(c.covered-c.bill)+'. This excess is counted once; please review the total.</p>':'')+'</section><section class="panel"><div class="heading"><h2>Other monthly expenses</h2>'+btn("+ Add","newItem","variable","primary")+'</div>'+table(["Category","Monthly expense",""],otherRows)+'<p class="muted">These items are outside the card. Earlier diesel, grocery and restaurant budget entries remain saved but are excluded from totals to prevent double-counting.</p><p><strong>Other monthly expenses: '+money(c.other)+'</strong></p></section><section class="panel"><div class="net-total"><span>Total other monthly expenses <small>Amazon card and other expenses, without double-counting</small></span><strong>'+money(c.total)+'</strong></div></section>'}
function cardBillEdit(id){const old=id?data.cardBills.find(x=>x.id===id):null;popup(old?"Edit card bill":"Add card bill",field("date","Purchase date",old?.date||month.value+"-01","date")+field("name","Description",old?.name||"Diesel")+'<label>Reporting category<select name="category">'+categoryOptions(old?.category||"Car")+'</select></label>'+field("amount","Amount (€)",old?.amount??0,"number"),v=>{const obj={id:id||uid(),date:v.date,name:v.name,category:v.category,amount:Number(v.amount)};if(old)Object.assign(old,obj);else data.cardBills.push(obj)})}
function budgets(){const c=cardSummary();return '<div class="two">'+categoryTable("fixed")+'<div>'+variableBudgets()+'</div></div><section class="panel"><h2>Monthly expense details</h2>'+data.variable.filter(x=>x.name!=="Amazon Credit Card Bill").map(x=>bar(x.name,spent(x.name),x.amount)).join("")+"</section>"}
function quarterly(){return '<section class="panel"><div class="heading"><h2>Quarterly bills</h2>'+btn("+ Add quarterly bill","newItem","quarterly","primary")+'</div>'+table(["Bill","Quarterly cost","Next due date",""],data.quarterly.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+money(amountAt(x,year()))+'</td><td>'+esc(x.due||"—")+'</td><td>'+btn("Edit","editItem","quarterly:"+x.id)+btn("Delete","deleteItem","quarterly:"+x.id,"link danger")+"</td></tr>").join(""))+'<p><strong>Quarterly total: '+money(historicTotal('quarterly',year()))+' · Monthly reserve: '+money(historicTotal('quarterly',year())/3)+' · Annual equivalent: '+money(historicTotal('quarterly',year())*4)+'</strong></p><div class="notice">Add recurring bills charged every three months. The due date is editable and serves as a reference; it does not automatically create a transaction.</div></section>'}
function halfyearly(){return '<section class="panel"><div class="heading"><h2>Half-yearly expenses</h2>'+btn("+ Add expense","newItem","halfyearly","primary")+'</div>'+table(["Expense","Six-month cost","Next due date",""],data.halfyearly.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+money(amountAt(x,year()))+'</td><td>'+esc(x.due||"—")+'</td><td>'+btn("Edit","editItem","halfyearly:"+x.id)+btn("Delete","deleteItem","halfyearly:"+x.id,"link danger")+"</td></tr>").join(""))+'<p><strong>Half-yearly total: '+money(historicTotal('halfyearly',year()))+' · Monthly reserve: '+money(historicTotal('halfyearly',year())/6)+' · Annual equivalent: '+money(historicTotal('halfyearly',year())*2)+'</strong></p><div class="notice">For expenses paid every six months. Due dates are reference dates and do not create transactions automatically.</div></section>'}
function annual(){return '<section class="panel"><div class="heading"><h2>Annual insurance & other bills</h2>'+btn("+ Add bill","newItem","annual","primary")+'</div>'+table(["Bill","Yearly cost","Reference due date",""],data.annual.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+money(amountAt(x,year()))+'</td><td>'+esc(x.due||"—")+'</td><td>'+btn("Edit","editItem","annual:"+x.id)+btn("Delete","deleteItem","annual:"+x.id,"link danger")+"</td></tr>").join(""))+'<p><strong>Annual total: '+money(historicTotal('annual',year()))+' · Monthly reserve: '+money(historicTotal('annual',year())/12)+'</strong></p><div class="notice">Due dates are reference dates. Review dates imported from month-only entries in your spreadsheet. Check the annual and monthly Radio entries for overlap.</div></section>'}
function accounts(){return '<div class="cards">'+card("Total account balances",sum(data.accounts,"balance"),"Manually entered balances")+'</div><section class="panel"><div class="heading"><h2>Accounts & savings</h2>'+btn("+ Add account","newItem","accounts","primary")+'</div>'+table(["Account","Balance",""],data.accounts.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+money(x.balance)+'</td><td>'+btn("Edit","editItem","accounts:"+x.id)+btn("Delete","deleteItem","accounts:"+x.id,"link danger")+"</td></tr>").join(""))+"</section>"}
function settings(){return '<div class="two"><section class="panel"><h2>Income settings</h2><div class="stack"><label>Default monthly income<input id="defaultIncome" type="number" min="0" step=".01" value="'+esc(data.income)+'"></label><label>Income for '+esc(month.value)+'<input id="currentIncome" type="number" min="0" step=".01" value="'+esc(income())+'"></label>'+btn("Save income","saveIncome","","primary")+'</div><div class="notice">The default €4,437 came from the spreadsheet. Update it to reflect your current circumstances.</div></section><section class="panel"><h2>Reporting categories</h2><p class="muted">Used in all expense category dropdowns.</p><div class="stack">'+data.categories.map(c=>'<div>'+esc(c)+' '+btn("Remove","removeCategory",c,"link danger")+'</div>').join("")+btn("+ Add category","addCategory","","primary")+'</div></section><section class="panel"><h2>Backup & privacy</h2><p class="muted">Transactions remain in this browser. The GitHub repository contains only app code; there is no cloud sync or banking connection.</p><div class="stack">'+btn("Export JSON backup","export","","primary")+btn("Import JSON backup","import")+btn("Reset all data","reset","","link danger")+'</div></section></div>'}
function yearly(){const y=Number(month.value.slice(0,4)),totals={};const add=(category,amount)=>{totals[category]=(totals[category]||0)+amount};
for(const [type,mult] of Object.entries({fixed:12,variable:12,quarterly:4,halfyearly:2,annual:1}))for(const x of data[type]){if(type==="variable"&&(x.name==="Amazon Credit Card Bill"||coveredNames.includes(x.name)))continue;add(x.category||inferCategory(x.name),(historicalTypes.includes(type)?amountAt(x,y):Number(x.amount)||0)*mult)}
const monthlyRows=[];let yearlyCard=0;for(let m=1;m<=12;m++){const ym=y+"-"+String(m).padStart(2,"0"),charges=(data.cardBills||[]).filter(x=>x.date.slice(0,7)===ym);const bill=cardSummary(y).bill,charged=sum(charges),groceries=Math.max(0,bill-charged);yearlyCard+=Math.max(bill,charged);add("Food",groceries);for(const x of charges)add(x.category||"Car",Number(x.amount)||0);const totalMonth=sum(data.fixed)+cardSummary(y).other+Math.max(bill,charged)+historicTotal("quarterly",y)/3+historicTotal("halfyearly",y)/6+historicTotal("annual",y)/12;monthlyRows.push('<tr><td>'+esc(ym)+'</td><td>'+money(totalMonth)+'</td></tr>')}
const total=Object.values(totals).reduce((a,b)=>a+b,0),yearIncome=Array.from({length:12},(_,i)=>Number(data.incomes[y+"-"+String(i+1).padStart(2,"0")]??data.income)||0).reduce((a,b)=>a+b,0);
const rows=[...Object.entries(totals)].sort((a,b)=>b[1]-a[1]).map(([cat,value])=>'<tr><td>'+esc(cat)+'</td><td>'+money(value)+'</td></tr>').join("");
return '<div class="cards">'+card("Total yearly expenses",total,"Recurring costs and card spending")+card("Total yearly income",yearIncome,"Income entries for "+y)+card("Income minus expenses",yearIncome-total,"Annual balance")+card("Amazon card expenses",yearlyCard,"Included in category totals")+'</div><div class="two"><section class="panel"><h2>Expenses by category — '+y+'</h2>'+table(["Category","Yearly amount"],rows)+'</section><section class="panel"><h2>Monthly expense breakdown — '+y+'</h2>'+table(["Month","Monthly equivalent"],monthlyRows.join(""))+'</section></div><div class="notice">Monthly, quarterly, half-yearly and annual expenses are annualized at their applicable year's amounts. The monthly figures show equivalent costs, not necessarily cash paid that month. Amazon card itemizations are allocated by their purchase month; the remaining card amount is groceries. No separate transaction ledger is included.</div>'}
const pages={dashboard,yearly,budgets,quarterly,halfyearly,annual,accounts,settings};
function render(){document.getElementById("title").textContent=({dashboard:"Monthly Dashboard",yearly:"Yearly Dashboard",budgets:"Monthly expenses",quarterly:"Quarterly bills",halfyearly:"Half-yearly expenses",annual:"Annual bills",accounts:"Accounts & savings",settings:"Settings & backup"})[page];document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));document.getElementById("view").innerHTML=pages[page]()}
function field(name,label,val,type="text"){return '<label>'+esc(label)+'<input name="'+name+'" type="'+type+'" '+(type==="number"?'min="0" step=".01"':"")+' required value="'+esc(val??"")+'"></label>'}
function popup(title,fields,cb){document.getElementById("fields").innerHTML="<h2>"+esc(title)+'</h2><div class="stack">'+fields+"</div>";document.getElementById("dialog").showModal();document.getElementById("form").onsubmit=e=>{e.preventDefault();const fd=Object.fromEntries(new FormData(e.target));if(cb(fd)!==false){save();document.getElementById("dialog").close();render()}}}
function itemEdit(type,id){const old=id?data[type].find(x=>x.id===id):null,account=type==="accounts",historical=historicalTypes.includes(type),selected=year();
popup(old?"Edit entry":"New entry",field("name","Name",old?.name||"")+field("amount",account?"Account balance (€)":type==="annual"?"Annual cost (€)":type==="quarterly"?"Quarterly cost (€)":type==="halfyearly"?"Six-month cost (€)":"Monthly expense (€)",old?(account?old.balance:historical?amountAt(old,selected):old.amount):0,"number")+(account?"":'<label>Reporting category<select name="group">'+categoryOptions(old?.category||inferCategory(old?.name||""))+'</select></label>')+(historical?'<div class="notice">The new amount takes effect from '+selected+'. Earlier years are preserved.</div>':"")+(historicalTypes.includes(type)?field("due","Reference due date",old?.due||new Date().toISOString().slice(0,10),"date"):""),v=>{if(data[type].some(x=>x.name.toLowerCase()===v.name.trim().toLowerCase()&&x.id!==id)){alert("Please use a unique name.");return false}const obj={id:id||uid(),name:v.name.trim(),[account?"balance":"amount"]:Number(v.amount),...(account?{}:{category:v.group})};if(historical){obj.amountHistory={...(old?.amountHistory||{}),[selected]:Number(v.amount)};if(old)obj.amount=old.amount;}if(historicalTypes.includes(type))obj.due=v.due;if(old)Object.assign(old,obj);else data[type].push(obj)})}
function txEdit(id){const t=id?data.transactions.find(x=>x.id===id):null;const cats=[...new Set([...data.fixed,...data.variable].map(x=>x.name).concat(["Salary / income","Other"]))];if(t?.category&&!cats.includes(t.category))cats.push(t.category);popup(t?"Edit transaction":"Add transaction",field("date","Date",t?.date||month.value+"-01","date")+'<label>Type<select name="kind"><option value="expense" '+(t?.kind==="expense"?"selected":"")+'>Expense</option><option value="income" '+(t?.kind==="income"?"selected":"")+'>Income</option></select></label><label>Category<select name="category">'+cats.map(c=>'<option '+(t?.category===c?"selected":"")+'>'+esc(c)+"</option>").join("")+"</select></label>"+'<label>Reporting category<select name="group">'+categoryOptions(t?.group||inferCategory(t?.category||""))+'</select></label>'+field("amount","Amount (€)",t?.amount??0,"number")+field("note","Description",t?.note||""),v=>{const obj={id:id||uid(),date:v.date,kind:v.kind,category:v.category,group:v.group,amount:Number(v.amount),note:v.note};if(t)Object.assign(t,obj);else data.transactions.push(obj)})}
document.getElementById("nav").onclick=e=>{const b=e.target.closest("[data-page]");if(b){page=b.dataset.page;render()}};

document.getElementById("cancel").onclick=()=>document.getElementById("dialog").close();
document.getElementById("month").onchange=render;
document.getElementById("view").onclick=e=>{const b=e.target.closest("[data-action]");if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==="go"){page=id;return render()}if(a==="newCardBill")return cardBillEdit();if(a==="editCardBill")return cardBillEdit(id);if(a==="deleteCardBill"){if(confirm("Delete this card bill?")){data.cardBills=data.cardBills.filter(x=>x.id!==id);save();render()}return}if(a==="editTx")return txEdit(id);if(a==="deleteTx"){if(confirm("Delete this transaction?")){data.transactions=data.transactions.filter(x=>x.id!==id);save();render()}return}if(a==="newItem")return itemEdit(id);if(a==="editItem"){const [type,key]=id.split(":");return itemEdit(type,key)}if(a==="deleteItem"){const [type,key]=id.split(":");if(confirm("Delete this entry?")){data[type]=data[type].filter(x=>x.id!==key);save();render()}return}if(a==="addCategory"){const n=prompt("New reporting category");if(n&&n.trim()&&!data.categories.some(c=>c.toLowerCase()===n.trim().toLowerCase())){data.categories.push(n.trim());save();render()}return}if(a==="removeCategory"){if(confirm("Remove from dropdown? Existing expenses retain this category.")){data.categories=data.categories.filter(c=>c!==id);save();render()}return}if(a==="saveIncome"){const f=Number(document.getElementById("defaultIncome").value),m=Number(document.getElementById("currentIncome").value);if(!Number.isFinite(f)||!Number.isFinite(m)||f<0||m<0)return alert("Invalid income");data.income=f;data.incomes[month.value]=m;save();render()}if(a==="export"){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"})),link=document.createElement("a");link.href=url;link.download="monthly-expenses-backup-"+new Date().toISOString().slice(0,10)+".json";link.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}if(a==="import")document.getElementById("import").click();if(a==="reset"&&confirm("Delete all locally saved budgets, transactions and balances? Export a backup first.")){data=structuredClone(defaults);save();render()}};
document.getElementById("import").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d||!["fixed","variable","quarterly","halfyearly","annual","accounts","transactions"].every(k=>Array.isArray(d[k])))throw Error("Invalid backup");if(confirm("Replace all current data with this backup?")){data=d;if(!Array.isArray(data.cardBills))data.cardBills=[];save();render()}}catch(err){alert("Import failed: "+err.message)}finally{e.target.value=""}};render();
})();
</script></body></html>
