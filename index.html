const form=document.getElementById("authForm");let authResolve;if(setup)form.querySelector("#continueNoPassword").onclick=()=>{if(!confirm("Without a password, financial records are not encrypted in this browser. Continue?"))return;try{const raw=localStorage.getItem(KEY)||JSON.stringify(defaults);JSON.parse(raw);localStorage.setItem(KEY,raw);localStorage.setItem(NO_PASSWORD_KEY,"yes");unlockUI();authResolve(raw)}catch(e){alert("Unable to open saved data: "+e.message)}};if(isV2){form.querySelector("#removePasswordWithKey").onclick=async()=>{const code=prompt("Enter your recovery key to remove password protection");if(code===null)return;const error=form.querySelector("#authError");error.textContent="";try{const bytes=await unwrap(previous.recoveryWrap,cleanRecovery(code));const key=await crypto.subtle.importKey("raw",bytes,{name:"AES-GCM"},false,["decrypt"]);const plain=await decrypt(previous,key);JSON.parse(plain);if(!confirm("Remove password protection? Your financial records will be stored UNENCRYPTED in this browser and anyone with access to it can view them."))return;localStorage.setItem(KEY,plain);localStorage.setItem(NO_PASSWORD_KEY,"yes");localStorage.removeItem(SECURE_KEY);location.reload()}catch(e){error.textContent="Incorrect recovery key or unreadable data. Nothing was changed."}};form.querySelector("#modeToggle").onclick=()=>{mode=mode==="password"?"recovery":"password";form.querySelector("#credentialLabel").firstChild.textContent=mode==="password"?"Password":"Recovery key";form.querySelector("#modeToggle").textContent=mode==="password"?"Forgot password? Use recovery key":"Use password instead";form.querySelector("#recoveryResetFields").style.display=mode==="recovery"?"block":"none";form.querySelector('button[type="submit"]').textContent=mode==="recovery"?"Reset password and unlock":"Unlock";form.elements.secret.value="";form.elements.secret.minLength=mode==="password"?8:40}};

let data;try{data=JSON.parse(initialData)||structuredClone(defaults)}catch{data=structuredClone(defaults)}if(!data||typeof data!=="object"||Array.isArray(data))throw Error("Saved data is not a valid expense record");
